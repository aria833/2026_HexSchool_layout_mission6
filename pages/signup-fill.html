<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首頁</title>

    <!--Bootstrap Icons-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <%- include('./layout/header'); -%>
    <main class="login-bg pb-10">
      <div class="container">
        <div class="row">
          <div class="col-lg-4 m-auto">
            <!--標題-->
            <div class="text-center">
              <h2 class="mb-2">歡迎加入 AI ToolVerse</h2>
              <p class="text-neutral-200 mb-6">
                立即建立帳號，開始探索 AI 工具
              </p>
            </div>
            <!--按鈕-->
            <div class="d-flex flex-column mb-6 text-primary-100">
              <a
                href="member.html"
                class="btn btn-outline-primary mb-4 py-2 rounded-pill"
              >
                <img
                  src="/assets/images/login-google.png"
                  alt=""
                  class="me-2"
                />
                使用 Google 繼續
              </a>
              <a
                href="member.html"
                class="btn btn-outline-primary mb-4 py-2 rounded-pill"
              >
                <img
                  src="/assets/images/login-facebook.png"
                  alt=""
                  class="me-2"
                />
                使用 Facebook 繼續
              </a>
              <a
                href="member.html"
                class="btn btn-outline-primary py-2 rounded-pill"
              >
                <img src="/assets/images/login-apple.png" alt="" class="me-2" />
                使用 Apple 繼續
              </a>
            </div>

            <!--分隔線-->
            <div class="d-flex align-items-center mb-6">
              <div class="login-divider me-2"></div>
              <p class="text-neutral-200 fs-sm me-2">或使用 Email 註冊</p>
              <div class="login-divider"></div>
            </div>

            <!--表單-->
            <form action="" class="mb-6">
              <div class="mb-4">
                <label
                  for="exampleFormControlInput1"
                  class="form-label mb-1 text-neutral-100"
                  >電子信箱</label
                >
                <input
                  type="email"
                  class="form-control bg-white border border-opacity-12 rounded-1 text-neutral-600"
                  id="exampleFormControlInput1"
                  placeholder="請輸入電子信箱"
                  value="helloworld@gmail.com"
                />
              </div>

              <div class="mb-3">
                <label
                  for="exampleFormControlInput1"
                  class="form-label mb-1 text-neutral-100"
                  >密碼</label
                >
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control text-neutral-600 bg-white border-0"
                    placeholder="Username"
                    aria-label="Username"
                    aria-describedby="basic-addon1"
                    id="exampleFormControlInput1"
                    value="123456"
                  />
                  <span
                    class="input-group-text text-neutral-600 bg-white"
                    id="basic-addon1"
                    ><i class="bi bi-eye-slash"></i
                  ></span>
                </div>
              </div>

              <div class="mb-3">
                <label
                  for="exampleFormControlInput1"
                  class="form-label mb-1 text-neutral-100"
                  >確認密碼</label
                >
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control text-neutral-600 bg-white border-0"
                    placeholder="Username"
                    aria-label="Username"
                    aria-describedby="basic-addon1"
                    id="exampleFormControlInput1"
                    value="123456"
                  />
                  <span
                    class="input-group-text text-neutral-600 bg-white"
                    id="basic-addon1"
                    ><i class="bi bi-eye-slash"></i
                  ></span>
                </div>
              </div>

              <div class="form-check mb-6">
                <input
                  class="form-check-input me-2"
                  checked
                  type="checkbox"
                  value=""
                  id="flexCheckDefault"
                />
                <label
                  class="form-check-label text-neutral-200 fs-sm"
                  for="flexCheckDefault"
                >
                  我同意<a href="#" class="text-primary-200">服務條款</a
                  ><span>與</span
                  ><a href="#" class="text-primary-200">隱私政策</a>
                </label>
              </div>

              <button
                type="button"
                class="btn btn-primary py-2 w-100 rounded-pill hover-bn"
                onclick="location.href = 'member.html'"
              >
                建立帳號
              </button>
            </form>
            <div class="d-flex justify-content-center">
              <p>已經有帳號了？</p>
              <a href="login.html" class="text-primary-200">立即登入</a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="../main.js"></script>
  </body>
</html>
